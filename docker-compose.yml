services:
  mysql:
    image: mysql:8.4
    container_name: bus-station-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bus_station
      MYSQL_USER: bus_user
      MYSQL_PASSWORD: bus_pass
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
