<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header(${isEdit} ? 'Edit Driver' : 'Add New Driver')}"></head>
<body>

<h1 th:text="${isEdit} ? 'Edit Driver' : 'Add New Driver'">Add New Driver</h1>
<!--/*@thymesVar id="driver" type="com.example.bus_station_management_system.model.Driver"*/-->
<form th:action="${isEdit} ? @{|/driver/${driver.id}|} : @{/driver}" th:object="${driver}" method="post">

    <div>
        <label for="name">Name:</label>
        <input type="text" id="name" th:field="*{name}" required/>
    </div>

    <div>
        <label for="salary">Salary:</label>
        <input type="number" id="salary" th:field="*{salary}" required/>
    </div>

    <div>
        <label for="yearsOfExperience">Years of experience:</label>
        <input type="number" id="yearsOfExperience" th:field="*{yearsOfExperience}" required/>
    </div>
    <div>
        <label for="decorations">Decorations:</label>
        <input type="text" id="decorations" th:field="*{decorations}" placeholder="e.g. Family photo, Dashboard figure"/>
    </div>

    <br>
    <button type="submit">Save Driver</button>
    <a th:href="@{/driver}">Cancel</a>
</form>
</body>
</html>
