<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<!-- Injects the header and CSS from layout.html -->
<head th:replace="~{fragments/layout :: header('Driver')}">
    <title>Driver</title>
</head>

<body>
<!-- Injects the navigation bar -->
<div th:replace="~{fragments/layout :: navbar}"></div>

<h1>Drivers</h1>
<a href="/driver/new">Add New Driver</a>
<table>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Years of experience</th>
        <th>Assignments</th>
        <th>Decorations</th>
    </tr>
    <tr th:each="item : ${drivers}">
        <td th:text="${item.id}"></td>
        <td th:text="${item.name}"></td>
        <td th:text="${item.yearsOfExperience}"></td>
        <td th:text="${item.assignments}"></td>
        <td th:text="${item.decorations}"></td>
        <td>
            <form th:action="@{|/driver/${item.id}/delete|}" method="post">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
