<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: header('Driver Details')}">
    <title>Driver Details</title>
</head>

<body>

<h1>Driver Details</h1>
<div th:replace="~{fragments/layout :: details-bar('/driver', ${driver.id})}"></div>
<!--/*@thymesVar id="driver" type="com.example.bus_station_management_system.model.Driver"*/-->
<table>
    <tr>
        <th>Name</th>
        <td th:text="${driver.name}"></td>
    </tr>
    <tr>
        <th>Salary</th>
        <td th:text="${driver.salary}"></td>
    </tr>
    <tr>
        <th>Years of experience</th>
        <td th:text="${driver.yearsOfExperience}"></td>
    </tr>
    <tr>
        <th>Decorations</th>
        <td th:text="${driver.decorations == null or driver.decorations.isEmpty() ? '-' : #strings.listJoin(driver.decorations, ', ')}"></td>
    </tr>
</table>

<h2>Duty Assignments</h2>
<p th:if="${#lists.isEmpty(assignments)}">No duty assignments found for this driver.</p>
<table th:unless="${#lists.isEmpty(assignments)}">
    <tr>
        <th>Trip</th>
        <th>Role</th>
        <th>Actions</th>
    </tr>
    <tr th:each="assignment : ${assignments}">
        <td th:text="${tripLabels.getOrDefault(assignment.tripId, '-')}"></td>
        <td th:text="${assignment.role}"></td>
        <td><a th:href="@{|/duty-assignment/${assignment.id}|}" class="retro-action-btn">Details</a></td>
    </tr>
</table>
</body>
</html>
