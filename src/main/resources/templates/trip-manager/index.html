<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<!-- Injects the header and CSS from layout.html -->
<head th:replace="~{fragments/layout :: header('Trip Manager')}">
    <title>Staff</title>
</head>

<body>
<!-- Injects the navigation bar -->
<div th:replace="~{fragments/layout :: navbar}"></div>

<h1>Trip Manager</h1>
<a href="/duty-assignments/new">Add New Bus</a>
<table>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Salary</th>
        <th>Employee Code</th>
        <th>Assignments</th>
    </tr>
    <tr th:each="item : ${drivers}">
        <td th:text="${item.id}"></td>
        <td th:text="${item.name}"></td>
        <td th:text="${item.salary}"></td>
        <td th:text="${item.employeeCode}"></td>
        <td th:text="${item.assignments}"></td>
        <td>
            <form th:action="@{|/bus/${item.id}/delete|}" method="post">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
