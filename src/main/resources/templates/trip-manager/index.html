<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<!-- Injects the header and CSS from layout.html -->
<head th:replace="~{fragments/layout :: header('Trip Manager')}">
    <title>Staff</title>
</head>

<body>

<h1>Trip Manager</h1>
<div th:replace="~{fragments/layout :: action-bar('/trip-manager')}"></div>
<!--<a href="/trip-manager/new">Add New Trip Manager</a>-->
<table>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Salary</th>
        <th>Employee Code</th>
        <th>Assignments</th>
    </tr>
    <tr th:each="item : ${tripManagers}">
        <td th:text="${item.id}"></td>
        <td th:text="${item.name}"></td>
        <td th:text="${item.salary}"></td>
        <td th:text="${item.employeeCode}"></td>
        <td th:text="${item.assignments}"></td>
        <td>
            <form th:action="@{|/trip-manager/${item.id}/delete|}" method="post">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
