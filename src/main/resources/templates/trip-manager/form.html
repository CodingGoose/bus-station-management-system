<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header(${isEdit} ? 'Edit Trip Manager' : 'Add New Trip Manager')}"></head>
<body>

<h1 th:text="${isEdit} ? 'Edit Trip Manager' : 'Add New Trip Manager'">Add New Trip Manager</h1>
<!--/*@thymesVar id="tripManager" type="com.example.bus_station_management_system.model.TripManager"*/-->
<form th:action="${isEdit} ? @{|/trip-manager/${tripManager.id}|} : @{/trip-manager}" th:object="${tripManager}" method="post">
    <div th:replace="~{fragments/layout :: form-errors}"></div>

    <div>
        <label for="name">Name:</label>
        <input type="text" id="name" th:field="*{name}" required/>
        <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
    </div>

    <div>
        <label for="salary">Salary:</label>
        <input type="number" id="salary" th:field="*{salary}" required/>
        <span class="field-error" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></span>
    </div>

    <div>
        <label for="employeeCode">Employee Code:</label>
        <input type="text" id="employeeCode" th:field="*{employeeCode}" required/>
        <span class="field-error" th:if="${#fields.hasErrors('employeeCode')}" th:errors="*{employeeCode}"></span>
    </div>

    <br>
    <button type="submit">Save Trip Manager</button>
    <a th:href="@{/trip-manager}">Cancel</a>
</form>
</body>
</html>
