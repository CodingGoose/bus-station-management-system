<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Add New Trip Manager')}"></head>
<body>

<h1>Add New Trip Manager</h1>
<!--/*@thymesVar id="tripManager" type="com.example.bus_station_management_system.model.TripManager"*/-->
<form th:action="@{/trip-manager}" th:object="${tripManager}" method="post">

    <div>
        <label for="id">ID:</label>
        <input type="text" id="id" th:field="*{id}" required/>
    </div>

    <div>
        <label for="name">Name:</label>
        <input type="text" id="name" th:field="*{name}" required/>
    </div>

    <div>
        <label for="salary">Salary:</label>
        <input type="number" id="salary" th:field="*{salary}" required/>
    </div>

    <div>
        <label for="employeeCode">Employee Code:</label>
        <input type="text" id="employeeCode" th:field="*{employeeCode}" required/>
    </div>

    <br>
    <button type="submit">Save Trip Manager</button>
    <a th:href="@{/trip-manager}">Cancel</a>
</form>
</body>
</html>
