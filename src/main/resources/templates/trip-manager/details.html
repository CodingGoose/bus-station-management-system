<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: header('Trip Manager Details')}">
    <title>Trip Manager Details</title>
</head>

<body>

<h1>Trip Manager Details</h1>
<div th:replace="~{fragments/layout :: details-bar('/trip-manager', ${tripManager.id})}"></div>
<!--/*@thymesVar id="tripManager" type="com.example.bus_station_management_system.model.TripManager"*/-->
<table>
    <tr>
        <th>Name</th>
        <td th:text="${tripManager.name}"></td>
    </tr>
    <tr>
        <th>Salary</th>
        <td th:text="${tripManager.salary}"></td>
    </tr>
    <tr>
        <th>Employee code</th>
        <td th:text="${tripManager.employeeCode}"></td>
    </tr>
</table>

<h2>Duty Assignments</h2>
<p th:if="${#lists.isEmpty(assignments)}">No duty assignments found for this trip manager.</p>
<table th:unless="${#lists.isEmpty(assignments)}">
    <tr>
        <th>Trip</th>
        <th>Role</th>
        <th>Actions</th>
    </tr>
    <tr th:each="assignment : ${assignments}">
        <td th:text="${tripLabels.getOrDefault(assignment.tripId, '-')}"></td>
        <td th:text="${assignment.role}"></td>
        <td><a th:href="@{|/duty-assignment/${assignment.id}|}" class="retro-action-btn">Details</a></td>
    </tr>
</table>
</body>
</html>
