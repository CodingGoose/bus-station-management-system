<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: header('Bus Station Details')}">
    <title>Bus Station Details</title>
</head>

<body>

<h1>Bus Station Details</h1>
<div th:replace="~{fragments/layout :: details-bar('/bus-station', ${busStation.id})}"></div>
<!--/*@thymesVar id="busStation" type="com.example.bus_station_management_system.model.BusStation"*/-->
<table>
    <tr>
        <th>Name</th>
        <td th:text="${busStation.name}"></td>
    </tr>
    <tr>
        <th>City</th>
        <td th:text="${busStation.city}"></td>
    </tr>
</table>

<h2>Trips</h2>
<p th:if="${#lists.isEmpty(trips)}">No trips scheduled through this station.</p>
<table th:unless="${#lists.isEmpty(trips)}">
    <tr>
        <th>Route</th>
        <th>Bus</th>
        <th>Start time</th>
        <th>Status</th>
        <th>Actions</th>
    </tr>
    <tr th:each="trip : ${trips}">
        <td th:text="${routeLabels.getOrDefault(trip.routeId, '-')}"></td>
        <td th:text="${busLabels.getOrDefault(trip.busId, '-')}"></td>
        <td th:text="${#temporals.format(trip.startTime, 'dd.MM.yyyy HH:mm')}"></td>
        <td th:text="${trip.status}"></td>
        <td><a th:href="@{|/bus-trip/${trip.id}|}" class="retro-action-btn">Details</a></td>
    </tr>
</table>
</body>
</html>
