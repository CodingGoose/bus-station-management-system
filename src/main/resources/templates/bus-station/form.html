<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header(${isEdit} ? 'Edit Bus Station' : 'Add New Bus Station')}"></head>
<body>

<h1 th:text="${isEdit} ? 'Edit Bus Station' : 'Add New Bus Station'">Add New Bus Station</h1>

<!--/*@thymesVar id="busStation" type="com.example.bus_station_management_system.model.BusStation"*/-->
<form th:action="${isEdit} ? @{|/bus-station/${busStation.id}|} : @{/bus-station}" th:object="${busStation}" method="post">
    <div th:replace="~{fragments/layout :: form-errors}"></div>
    <div>
        <label for="name">Name:</label>
        <input type="text" id="name" th:field="*{name}" required/>
        <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
    </div>
    <div>
        <label for="city">City:</label>
        <input type="text" id="city" th:field="*{city}" required/>
        <span class="field-error" th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></span>
    </div>
    <br>
    <button type="submit">Save Station</button>
    <a th:href="@{/bus-station}">Cancel</a>
</form>
</body>
</html>
