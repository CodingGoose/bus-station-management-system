<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<!-- Injects the header and CSS from layout.html -->
<head th:replace="~{fragments/layout :: header('Bus Stations')}">
    <title>Bus Stations</title>
</head>

<body>

<h1>Bus Stations</h1>
<div th:replace="~{fragments/layout :: action-bar('/bus-station')}"></div>
<!-- Only the most important columns; everything else is on the details page -->
<table>
    <tr>
        <th>Name</th>
        <th>City</th>
        <th>Actions</th>
    </tr>
    <tr th:each="item : ${busStations}">
        <td th:text="${item.name}"></td>
        <td th:text="${item.city}"></td>
        <td th:replace="~{fragments/layout :: row-actions('/bus-station', ${item.id})}"></td>
    </tr>
</table>
</body>
</html>
