<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Add New Ticket')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<h1>Add New Ticket</h1>

<!--/*@thymesVar id="ticket" type="com.example.bus_station_management_system.model.Ticket"*/-->
<form th:action="@{/ticket}" th:object="${ticket}" method="post">
    <div>
        <label for="id">Ticket ID:</label>
        <input type="text" id="id" th:field="*{id}" required/>
    </div>
    <div>
        <label for="tripId">Trip ID:</label>
        <input type="text" id="tripId" th:field="*{tripId}" required/>
    </div>
    <div>
        <label for="passengerId">Passenger ID:</label>
        <input type="text" id="passengerId" th:field="*{passengerId}" required/>
    </div>
    <div>
        <label for="seatNumber">Seat Number:</label>
        <input type="text" id="seatNumber" th:field="*{seatNumber}" required/>
    </div>
    <div>
        <label for="price">Price:</label>
        <input type="number" step="0.01" id="price" th:field="*{price}" required/>
    </div>
    <br>
    <button type="submit">Save Ticket</button>
    <a th:href="@{/ticket}">Cancel</a>
</form>
</body>
</html>
