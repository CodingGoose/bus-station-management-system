<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<!-- Injects the header and CSS from layout.html -->
<head th:replace="~{fragments/layout :: header('Tickets')}">
    <title>Tickets</title>
</head>

<body>

<h1>Tickets</h1>
<div th:replace="~{fragments/layout :: action-bar('/ticket')}"></div>
<!-- Only the most important columns; everything else is on the details page -->
<table>
    <tr>
        <th>Passenger</th>
        <th>Trip</th>
        <th>Actions</th>
    </tr>
    <tr th:each="item : ${tickets}">
        <td th:text="${passengerLabels.getOrDefault(item.passengerId, '-')}"></td>
        <td th:text="${tripLabels.getOrDefault(item.tripId, '-')}"></td>
        <td th:replace="~{fragments/layout :: row-actions('/ticket', ${item.id})}"></td>
    </tr>
</table>
</body>
</html>
