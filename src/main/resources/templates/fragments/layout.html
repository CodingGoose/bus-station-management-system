<!-- src/main/resources/templates/fragments/layout.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="EN">
<head th:fragment="header(title)">
    <meta charset="UTF-8">
    <title th:text="${title}">Bus Management</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <style> body { font-family: sans-serif; } table { border-collapse: collapse; } td, th { border: 1px solid black; padding: 8px; } </style>
</head>
<body>

<div th:fragment="back-button" class="nav-bar-container">
    <a href="/" class="back-btn">&larr; BACK TO DASHBOARD</a>
</div>

<div th:fragment="action-bar(newUrl)" class="action-bar">
    <a href="/" class="retro-action-btn">&larr; BACK TO DASHBOARD</a>
    <a th:href="@{__${newUrl}__/new}" class="retro-action-btn add-btn">+ ADD NEW</a>
</div>

</body>
</html>
