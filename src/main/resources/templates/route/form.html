<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Add New Route')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<h1>Add New Route</h1>

<!--/*@thymesVar id="route" type="com.example.bus_station_management_system.model.Route"*/-->
<form th:action="@{/route}" th:object="${route}" method="post">
    <div>
        <label for="id">Route ID:</label>
        <input type="text" id="id" th:field="*{id}" required/>
    </div>
    <div>
        <label for="originId">Origin Station ID:</label>
        <input type="text" id="originId" th:field="*{origin.id}" required/>
    </div>
    <div>
        <label for="destinationId">Destination Station ID:</label>
        <input type="text" id="destinationId" th:field="*{destination.id}" required/>
    </div>
    <div>
        <label for="distance">Distance:</label>
        <input type="number" step="0.01" id="distance" th:field="*{distance}" required/>
    </div>
    <br>
    <button type="submit">Save Route</button>
    <a th:href="@{/route}">Cancel</a>
</form>
</body>
</html>
