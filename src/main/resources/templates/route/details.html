<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: header('Route Details')}">
    <title>Route Details</title>
</head>

<body>

<h1>Route Details</h1>
<div th:replace="~{fragments/layout :: details-bar('/route', ${route.id})}"></div>
<!--/*@thymesVar id="route" type="com.example.bus_station_management_system.model.Route"*/-->
<table>
    <tr>
        <th>Origin</th>
        <td th:text="${stationLabels.getOrDefault(route.origin?.id, '-')}"></td>
    </tr>
    <tr>
        <th>Destination</th>
        <td th:text="${stationLabels.getOrDefault(route.destination?.id, '-')}"></td>
    </tr>
    <tr>
        <th>Distance</th>
        <td th:text="${route.distance + ' km'}"></td>
    </tr>
</table>

<h2>Trips</h2>
<p th:if="${#lists.isEmpty(trips)}">No trips scheduled on this route.</p>
<table th:unless="${#lists.isEmpty(trips)}">
    <tr>
        <th>Bus</th>
        <th>Start time</th>
        <th>Status</th>
        <th>Actions</th>
    </tr>
    <tr th:each="trip : ${trips}">
        <td th:text="${busLabels.getOrDefault(trip.busId, '-')}"></td>
        <td th:text="${#temporals.format(trip.startTime, 'dd.MM.yyyy HH:mm')}"></td>
        <td th:text="${trip.status}"></td>
        <td><a th:href="@{|/bus-trip/${trip.id}|}" class="retro-action-btn">Details</a></td>
    </tr>
</table>
</body>
</html>
