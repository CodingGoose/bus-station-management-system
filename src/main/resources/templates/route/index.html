<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<!-- Injects the header and CSS from layout.html -->
<head th:replace="~{fragments/layout :: header('Routes')}">
    <title>Routes</title>
</head>

<body>

<h1>Routes</h1>
<div th:replace="~{fragments/layout :: action-bar('/route')}"></div>
<!-- Only the most important columns; everything else is on the details page -->
<table>
    <tr>
        <th>Origin</th>
        <th>Destination</th>
        <th>Actions</th>
    </tr>
    <tr th:each="item : ${routes}">
        <td th:text="${stationLabels.getOrDefault(item.origin?.id, '-')}"></td>
        <td th:text="${stationLabels.getOrDefault(item.destination?.id, '-')}"></td>
        <td th:replace="~{fragments/layout :: row-actions('/route', ${item.id})}"></td>
    </tr>
</table>
</body>
</html>
