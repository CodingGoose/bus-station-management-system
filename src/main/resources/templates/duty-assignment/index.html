<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<!-- Injects the header and CSS from layout.html -->
<head th:replace="~{fragments/layout :: header('Duty Assignments')}">
    <title>Duty Assignments</title>
</head>

<body>

<h1>Duty Assignments</h1>
<div th:replace="~{fragments/layout :: action-bar('/duty-assignment')}"></div>
<!-- Only the most important columns; everything else is on the details page -->
<table>
    <tr>
        <th>Staff</th>
        <th>Trip</th>
        <th>Actions</th>
    </tr>
    <tr th:each="item : ${dutyAssignments}">
        <td th:text="${staffLabels.getOrDefault(item.staffId, '-')}"></td>
        <td th:text="${tripLabels.getOrDefault(item.tripId, '-')}"></td>
        <td th:replace="~{fragments/layout :: row-actions('/duty-assignment', ${item.id})}"></td>
    </tr>
</table>
</body>
</html>
