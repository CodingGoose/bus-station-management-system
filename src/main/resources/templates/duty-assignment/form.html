<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Add New Duty Assignment')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<h1>Add New Duty Assignment</h1>
<!--/*@thymesVar id="dutyAssignment" type="com.example.bus_station_management_system.model.DutyAssignment"*/-->
<form th:action="@{/duty-assignment}" th:object="${dutyAssignment}" method="post">

    <div>
        <label for="id">Assignment ID:</label>
        <input type="text" id="id" th:field="*{id}" required/>
    </div>

    <div>
        <label for="tripID">Trip ID:</label>
        <input type="text" id="tripID" th:field="*{tripId}" required/>
    </div>

    <div>
        <label for="staffID">Staff ID:</label>
        <input type="text" id="staffID" th:field="*{staffId}" required/>
    </div>

    <div>
        <label for="role">Role:</label>
        <select id="role" th:field="*{role}" required>
            <!-- The value must exactly match the Enum names in DutyAssignment.java -->
            <option value="PrimaryDriver">Primary Driver</option>
            <option value="ReserveDriver">Reserve Driver</option>
        </select>
    </div>

    <br>
    <button type="submit">Save Duty Assignment</button>
    <a th:href="@{/duty-assignment}">Cancel</a>
</form>
</body>
</html>
