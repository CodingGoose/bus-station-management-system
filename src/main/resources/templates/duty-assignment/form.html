<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header(${isEdit} ? 'Edit Duty Assignment' : 'Add New Duty Assignment')}"></head>
<body>

<h1 th:text="${isEdit} ? 'Edit Duty Assignment' : 'Add New Duty Assignment'">Add New Duty Assignment</h1>
<!--/*@thymesVar id="dutyAssignment" type="com.example.bus_station_management_system.model.DutyAssignment"*/-->
<form th:action="${isEdit} ? @{|/duty-assignment/${dutyAssignment.id}|} : @{/duty-assignment}" th:object="${dutyAssignment}" method="post">
    <div th:replace="~{fragments/layout :: form-errors}"></div>

    <div>
        <label for="tripID">Trip:</label>
        <select id="tripID" th:field="*{tripId}" required>
            <option value="">-- Select a trip --</option>
            <option th:each="entry : ${tripLabels}" th:value="${entry.key}" th:text="${entry.value}"></option>
        </select>
        <span class="field-error" th:if="${#fields.hasErrors('tripId')}" th:errors="*{tripId}"></span>
    </div>

    <div>
        <label for="staffID">Staff:</label>
        <select id="staffID" th:field="*{staffId}" required>
            <option value="">-- Select a staff member --</option>
            <option th:each="entry : ${staffLabels}" th:value="${entry.key}" th:text="${entry.value}"></option>
        </select>
        <span class="field-error" th:if="${#fields.hasErrors('staffId')}" th:errors="*{staffId}"></span>
    </div>

    <div>
        <label for="role">Role:</label>
        <select id="role" th:field="*{role}" required>
            <!-- The value must exactly match the Enum names in DutyAssignment.java -->
            <option value="PrimaryDriver">Primary Driver</option>
            <option value="ReserveDriver">Reserve Driver</option>
        </select>
        <span class="field-error" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></span>
    </div>

    <br>
    <button type="submit">Save Duty Assignment</button>
    <a th:href="@{/duty-assignment}">Cancel</a>
</form>
</body>
</html>
