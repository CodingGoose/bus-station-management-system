<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<!-- Injects the header and CSS from layout.html -->
<head th:replace="~{fragments/layout :: header('Passengers')}">
    <title>Passengers</title>
</head>

<body>

<h1>Passengers</h1>
<div th:replace="~{fragments/layout :: action-bar('/passenger')}"></div>
<!-- Only the most important columns; everything else is on the details page -->
<table>
    <tr>
        <th>Name</th>
        <th>Actions</th>
    </tr>
    <tr th:each="item : ${passengers}">
        <td th:text="${item.name}"></td>
        <td th:replace="~{fragments/layout :: row-actions('/passenger', ${item.id})}"></td>
    </tr>
</table>
</body>
</html>
