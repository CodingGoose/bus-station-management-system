<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header(${isEdit} ? 'Edit Passengers' : 'Add New Passengers')}"></head>
<body>

<h1 th:text="${isEdit} ? 'Edit Passenger' : 'Add New Passenger'">Add New Passenger</h1>
<!--/*@thymesVar id="passenger" type="com.example.bus_station_management_system.model.Passenger"*/-->
<form th:action="${isEdit} ? @{|/passenger/${passenger.id}|} : @{/passenger}" th:object="${passenger}" method="post">

    <div>
        <label for="name">Name:</label>
        <input type="text" id="name" th:field="*{name}" required/>
    </div>

    <div>
        <label for="currency">Currency:</label>
        <input type="text" id="currency" th:field="*{currency}" required/>
    </div>

    <br>
    <button type="submit">Save Passenger</button>
    <a th:href="@{/passenger}">Cancel</a>
</form>
</body>
</html>
