<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: header('Passenger Details')}">
    <title>Passenger Details</title>
</head>

<body>

<h1>Passenger Details</h1>
<div th:replace="~{fragments/layout :: details-bar('/passenger', ${passenger.id})}"></div>
<!--/*@thymesVar id="passenger" type="com.example.bus_station_management_system.model.Passenger"*/-->
<table>
    <tr>
        <th>Name</th>
        <td th:text="${passenger.name}"></td>
    </tr>
    <tr>
        <th>Currency</th>
        <td th:text="${passenger.currency}"></td>
    </tr>
</table>

<h2>Tickets</h2>
<p th:if="${#lists.isEmpty(tickets)}">No tickets found for this passenger.</p>
<table th:unless="${#lists.isEmpty(tickets)}">
    <tr>
        <th>Trip</th>
        <th>Seat number</th>
        <th>Price</th>
        <th>Actions</th>
    </tr>
    <tr th:each="ticket : ${tickets}">
        <td th:text="${tripLabels.getOrDefault(ticket.tripId, '-')}"></td>
        <td th:text="${ticket.seatNumber}"></td>
        <td th:text="${ticket.price}"></td>
        <td><a th:href="@{|/ticket/${ticket.id}|}" class="retro-action-btn">Details</a></td>
    </tr>
</table>
</body>
</html>
