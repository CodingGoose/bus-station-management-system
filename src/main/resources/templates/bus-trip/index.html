<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<!-- Injects the header and CSS from layout.html -->
<head th:replace="~{fragments/layout :: header('Bus Trips')}">
    <title>Bus Trips</title>
</head>

<body>

<h1>Bus Trips</h1>
<div th:replace="~{fragments/layout :: action-bar('/bus-trip')}"></div>
<!-- Only the most important columns; everything else is on the details page -->
<table>
    <tr>
        <th>Route</th>
        <th>Start Time</th>
        <th>Actions</th>
    </tr>
    <tr th:each="item : ${busTrips}">
        <td th:text="${routeLabels.getOrDefault(item.routeId, '-')}"></td>
        <td th:text="${#temporals.format(item.startTime, 'dd.MM.yyyy HH:mm')}"></td>
        <td th:replace="~{fragments/layout :: row-actions('/bus-trip', ${item.id})}"></td>
    </tr>
</table>
</body>
</html>
