<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header(${isEdit} ? 'Edit Bus Trip' : 'Add New Bus Trip')}"></head>
<body>

<h1 th:text="${isEdit} ? 'Edit Bus Trip' : 'Add New Bus Trip'">Add New Bus Trip</h1>

<!--/*@thymesVar id="busTrip" type="com.example.bus_station_management_system.model.BusTrip"*/-->
<form th:action="${isEdit} ? @{|/bus-trip/${busTrip.id}|} : @{/bus-trip}" th:object="${busTrip}" method="post">
    <div>
        <label for="routeId">Route:</label>
        <select id="routeId" th:field="*{routeId}" required>
            <option value="">-- Select a route --</option>
            <option th:each="entry : ${routeLabels}" th:value="${entry.key}" th:text="${entry.value}"></option>
        </select>
    </div>
    <div>
        <label for="busId">Bus:</label>
        <select id="busId" th:field="*{busId}" required>
            <option value="">-- Select a bus --</option>
            <option th:each="entry : ${busLabels}" th:value="${entry.key}" th:text="${entry.value}"></option>
        </select>
    </div>
    <div>
        <label for="startTime">Start Time:</label>
        <input type="text" id="startTime" th:field="*{startTime}" placeholder="YYYY-MM-DD HH:MM" required/>
    </div>
    <div>
        <label for="status">Status:</label>
        <select id="status" th:field="*{status}">
            <option value="Planned">Planned</option>
            <option value="Active">Active</option>
            <option value="Completed">Completed</option>
        </select>
    </div>
    <br>
    <button type="submit">Save Bus Trip</button>
    <a th:href="@{/bus-trip}">Cancel</a>
</form>
</body>
</html>
