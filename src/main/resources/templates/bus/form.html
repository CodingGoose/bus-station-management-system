<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Add New Bus')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<h1>Add New Bus</h1>
<!--/*@thymesVar id="bus" type="com.example.bus_station_management_system.model.Bus"*/-->
<form th:action="@{/bus}" th:object="${bus}" method="post">

    <div>
        <label for="id">Bus ID:</label>
        <input type="text" id="id" th:field="*{id}" required/>
    </div>

    <div>
        <label for="registrationNumber">Registration Number:</label>
        <input type="text" id="registrationNumber" th:field="*{registrationNumber}" required/>
    </div>

    <div>
        <label for="capacity">Capacity:</label>
        <input type="number" id="capacity" th:field="*{capacity}" required/>
    </div>

    <div>
        <label for="hasAC">Has AC:</label>
        <input type="checkbox" id="hasAC" th:field="*{hasAC}"/>
    </div>

    <div>
        <label for="fuelType">Fuel Type:</label>
        <select id="fuelType" th:field="*{fuelType}">
            <option value="Gasoline">Gasoline</option>
            <option value="Diesel">Diesel</option>
            <option value="Electric">Electric</option>
            <option value="Hybrid">Hybrid</option>
        </select>
    </div>

    <div>
        <label for="status">Status:</label>
        <select id="status" th:field="*{status}">
            <option value="Active">Active</option>
            <option value="Down">Down</option>
        </select>
    </div>

    <br>
    <button type="submit">Save Bus</button>
    <a th:href="@{/bus}">Cancel</a>
</form>
</body>
</html>
