<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Add New Bus')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<h1>Add New Bus</h1>

<form th:action="@{/bus}" th:object="${bus}" method="post">

    <div>
        <label for="id">Bus ID:</label>
        <input type="text" id="id" th:field="*{id}" required/>
    </div>

    <div>
        <label for="registrationNumber">Registration Number:</label>
        <input type="text" id="registrationNumber" th:field="*{registrationNumber}" required/>
    </div>

    <div>
        <label for="capacity">Capacity:</label>
        <input type="number" id="capacity" th:field="*{capacity}" required/>
    </div>

    <div>
        <label for="manufacturer">Manufacturer:</label>
        <input type="text" id="manufacturer" th:field="*{manufacturer}" required/>
    </div>

    <div>
        <label for="manufacturingYear">Manufacturing Year:</label>
        <input type="number" id="manufacturingYear" th:field="*{manufacturingYear}" required/>
    </div>
<!--    <div>-->
<!--        <label for="manufacturingYear">Manufacturing Year:</label>-->
<!--        <input type="range" id="manufacturingYear" th:field="*{manufacturingYear}" min="10" max="50000" oninput="this.nextElementSibling.value = this.value" />-->
<!--        <output>2505</output>-->
<!--    </div>-->

    <div>
        <label for="hasAC">Has AC:</label>
        <input type="checkbox" id="hasAC" th:field="*{hasAC}"/>
    </div>

    <div>
        <label for="fuelType">Fuel Type:</label>
        <select id="fuelType" th:field="*{fuelType}">
            <option value="GASOLINE">Gasoline</option>
            <option value="DIESEL">Diesel</option>
            <option value="ELECTRIC">Electric</option>
            <option value="HYBRID">Hybrid</option>
        </select>
    </div>

    <div>
        <label for="status">Status:</label>
        <select id="status" th:field="*{status}">
            <option value="ACTIVE">Active</option>
            <option value="IN_MAINTENANCE">In Maintenance</option>
            <option value="OUT_OF_SERVICE">Out of Service</option>
        </select>
    </div>

    <br>
    <button type="submit">Save Bus</button>
    <a th:href="@{/bus}">Cancel</a>
</form>
</body>
</html>
