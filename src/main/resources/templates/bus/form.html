<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header(${isEdit} ? 'Edit Bus' : 'Add New Bus')}"></head>
<body>

<h1 th:text="${isEdit} ? 'Edit Bus' : 'Add New Bus'">Add New Bus</h1>
<!--/*@thymesVar id="bus" type="com.example.bus_station_management_system.model.Bus"*/-->
<form th:action="${isEdit} ? @{|/bus/${bus.id}|} : @{/bus}" th:object="${bus}" method="post">
    <div th:replace="~{fragments/layout :: form-errors}"></div>

    <div>
        <label for="registrationNumber">Registration Number:</label>
        <input type="text" id="registrationNumber" th:field="*{registrationNumber}" required/>
        <span class="field-error" th:if="${#fields.hasErrors('registrationNumber')}" th:errors="*{registrationNumber}"></span>
    </div>

    <div>
        <label for="capacity">Capacity:</label>
        <input type="number" id="capacity" th:field="*{capacity}" required/>
        <span class="field-error" th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}"></span>
    </div>

    <div>
        <label for="hasAC">Has AC:</label>
        <input type="checkbox" id="hasAC" th:field="*{hasAC}"/>
    </div>

    <div>
        <label for="fuelType">Fuel Type:</label>
        <select id="fuelType" th:field="*{fuelType}">
            <option value="Gasoline">Gasoline</option>
            <option value="Diesel">Diesel</option>
            <option value="Electric">Electric</option>
            <option value="Hybrid">Hybrid</option>
        </select>
        <span class="field-error" th:if="${#fields.hasErrors('fuelType')}" th:errors="*{fuelType}"></span>
    </div>

    <div>
        <label for="status">Status:</label>
        <select id="status" th:field="*{status}">
            <option value="Active">Active</option>
            <option value="Down">Down</option>
        </select>
        <span class="field-error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></span>
    </div>

    <br>
    <button type="submit">Save Bus</button>
    <a th:href="@{/bus}">Cancel</a>
</form>
</body>
</html>
