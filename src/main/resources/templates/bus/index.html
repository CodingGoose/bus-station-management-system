<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<!-- Injects the header and CSS from layout.html -->
<head th:replace="~{fragments/layout :: header('Buses')}">
    <title>Buses</title>
</head>

<body>

<h1>Bus Fleet</h1>
<div th:replace="~{fragments/layout :: action-bar('/bus')}"></div>
<!-- Only the most important columns; everything else is on the details page -->
<table>
    <tr>
        <th>Reg. Number</th>
        <th>Status</th>
        <th>Actions</th>
    </tr>
    <tr th:each="item : ${buses}">
        <td th:text="${item.registrationNumber}"></td>
        <td th:text="${item.status}"></td>
        <td th:replace="~{fragments/layout :: row-actions('/bus', ${item.id})}"></td>
    </tr>
</table>
</body>
</html>
