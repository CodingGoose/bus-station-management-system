<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<!-- Injects the header and CSS from layout.html -->
<head th:replace="~{fragments/layout :: header('Buses')}">
    <title>Buses</title>
</head>

<body>

<h1>Bus Fleet</h1>
<div th:replace="~{fragments/layout :: action-bar('/bus')}"></div>
<!--<a href="/bus/new">Add New Bus</a>-->
<table>
    <tr>
        <th>ID</th>
        <th>Reg. Number</th>
        <th>Capacity</th>
        <th>hasAC</th>
        <th>Fuel Type</th>
        <th>Actions</th>
    </tr>
    <tr th:each="item : ${buses}">
        <td th:text="${item.id}"></td>
        <td th:text="${item.registrationNumber}"></td>
        <td th:text="${item.capacity}"></td>
        <td th:text="${item.hasAC}"></td>
        <td th:text="${item.fuelType}"></td>
        <td>
            <form th:action="@{|/bus/${item.id}/delete|}" method="post">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
